x-netbox: &netbox
  image: ${SOLOMON_IMAGE:?Set SOLOMON_IMAGE in .env.production}
  restart: unless-stopped
  env_file: ${SOLOMON_ENV_FILE:-.env.production}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    redis-cache:
      condition: service_healthy
  volumes:
    - media:/opt/netbox/netbox/media
    - reports:/opt/netbox/netbox/reports
    - scripts:/opt/netbox/netbox/scripts
  networks:
    - backend

services:
  caddy:
    image: docker.io/caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - frontend
    depends_on:
      netbox:
        condition: service_healthy

  netbox:
    <<: *netbox
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/login/ >/dev/null"]
      start_period: 120s
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - frontend
      - backend

  netbox-worker:
    <<: *netbox
    command:
      - /opt/netbox/venv/bin/python
      - /opt/netbox/netbox/manage.py
      - rqworker

  postgres:
    image: docker.io/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env.production}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env.production}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d \"$$POSTGRES_DB\" -U \"$$POSTGRES_USER\""]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend

  redis:
    image: docker.io/valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["sh", "-c", "valkey-server --appendonly yes --requirepass $$REDIS_PASSWORD"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --pass \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data
    networks:
      - backend

  redis-cache:
    image: docker.io/valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["sh", "-c", "valkey-server --requirepass $$REDIS_CACHE_PASSWORD"]
    environment:
      REDIS_CACHE_PASSWORD: ${REDIS_CACHE_PASSWORD:?Set REDIS_CACHE_PASSWORD in .env.production}
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --pass \"$$REDIS_CACHE_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  volume-tools:
    image: docker.io/alpine:3.22
    profiles: ["tools"]
    volumes:
      - media:/data/media
      - reports:/data/reports
      - scripts:/data/scripts
      - ./backups:/backups

volumes:
  caddy-config:
  caddy-data:
  media:
  postgres-data:
  redis-data:
  reports:
  scripts:

networks:
  frontend:
  backend:
    internal: true