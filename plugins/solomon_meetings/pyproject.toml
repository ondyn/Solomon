[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solomon-meetings"
version = "0.1.0"
description = "Solomon meetings plugin - meeting management and weighted voting"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    {name = "Solomon Dev"},
]

[project.urls]
Homepage = "https://github.com/ondyn/Solomon"

[tool.setuptools.packages.find]
include = ["solomon_meetings*"]

[tool.setuptools.package-data]
solomon_meetings = ["templates/**/*", "locale/**/*"]
