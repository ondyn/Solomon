####
## Solomon Property Plugin
##
## Property inventory management: Buildings, Flats, Persons, Owners, Tenants.
## NetBox plugin for the Solomon facility management system.
####

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solomon-property"
version = "0.1.1"
description = "Solomon property inventory plugin - buildings, flats, persons, owners, tenants"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    {name = "Solomon Dev"},
]

[project.urls]
Homepage = "https://github.com/ondyn/Solomon"

[tool.setuptools.packages.find]
include = ["solomon_property*"]

[tool.setuptools.package-data]
solomon_property = ["templates/**/*", "locale/**/*"]
