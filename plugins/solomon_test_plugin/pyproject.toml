####
## Solomon Test Plugin
##
## A minimal NetBox plugin to verify the plugin development workflow.
## Located in ./plugins/solomon_test_plugin/
####

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solomon-test-plugin"
version = "0.1.0"
description = "Solomon test plugin for NetBox - verifies plugin development workflow"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    {name = "Solomon Dev"},
]

[project.urls]
Homepage = "https://github.com/ondyn/Solomon"

[tool.setuptools.packages.find]
include = ["solomon_test_plugin*"]
